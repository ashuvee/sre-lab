groups:
  - name: lab
    rules:
      - alert: KubernetesMetricsUnavailable
        expr: up{job="k3s-node"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Kubernetes metrics are unavailable
      - alert: ContainerMemoryHigh
        expr: sum(container_memory_working_set_bytes{container!="",container!="POD"}) > 500000000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Kubernetes containers use more than 500 MB
