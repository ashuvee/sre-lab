apiVersion: v1
kind: Namespace
metadata:
  name: sre-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: sample}
  template:
    metadata:
      labels: {app: sample}
    spec:
      containers:
        - name: sample
          image: nginx:1.29-alpine
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 48Mi}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sample
  namespace: sre-lab
spec:
  selector: {app: sample}
  ports:
    - port: 80
      targetPort: 80
