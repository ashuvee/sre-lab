apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-prometheus
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-prometheus-node-proxy
rules:
  - apiGroups: ['']
    resources: ['nodes/proxy']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-prometheus-node-proxy
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lab-prometheus-node-proxy}
subjects:
  - {kind: ServiceAccount, name: lab-prometheus, namespace: kube-system}
---
apiVersion: v1
kind: Secret
metadata:
  name: lab-prometheus-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: lab-prometheus
type: kubernetes.io/service-account-token
